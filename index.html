  var LS_KEY = "swrp_gate_pw", LS_TS = "swrp_gate_ts", MAX_AGE = 30 * 864e5;

  function b64ToBytes(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  async function decrypt(password) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(SALT), iterations: ITER, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(IV) }, key, b64ToBytes(PAYLOAD));
    return new TextDecoder().decode(plain);
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  var f = document.getElementById("f"), p = document.getElementById("p"),
      e = document.getElementById("e"), btn = document.getElementById("btn"),
      rm = document.getElementById("rm");

  async function tryPassword(password, fromStore) {
    btn.disabled = true; e.textContent = "";
    try {
      var html = await decrypt(password);
      try {
        if (rm.checked || fromStore) {
          localStorage.setItem(LS_KEY, password);
          localStorage.setItem(LS_TS, String(Date.now()));
        }
      } catch (_) {}
      show(html);
    } catch (err) {
      btn.disabled = false;
      if (!fromStore) e.textContent = "Неверный пароль";
      try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_TS); } catch (_) {}
    }
  }

  f.addEventListener("submit", function (ev) { ev.preventDefault(); if (p.value) tryPassword(p.value, false); });

  try {
    var saved = localStorage.getItem(LS_KEY), ts = +localStorage.getItem(LS_TS);
    if (saved && ts && Date.now() - ts < MAX_AGE) { rm.checked = true; tryPassword(saved, true); }
  } catch (_) {}
})();
