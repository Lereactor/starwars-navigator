<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>StarWarsRP · Навигатор</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
    :root {
        --bg: #0a1a20;
        --panel: #10333d;
        --panel-2: #0c2731;
        --line: #2d6775;
        --accent: #6fc1d6;
        --me: #4fd0ff;
        --target: #ffd24a;
        --text: #dff1f5;
        --muted: #7fb2c0;
    }
    html, body { height: 100%; }
    body {
        background: radial-gradient(circle at 50% 0%, #12333d, #08151a);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
        gap: 10px;
        user-select: none;
        min-height: 100%;
    }

    /* ---- каркас: карта + панель управления ---- */
    .app-shell {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 900px;
    }
    .map-col { display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; }
    .side-col { display: flex; flex-direction: column; gap: 10px; width: 100%; min-width: 0; }

    /* широкий экран: карта слева на всю высоту, панель справа со своей прокруткой */
    @media (min-width: 900px) {
        body { padding: 12px; gap: 12px; }
        .app-shell {
            flex-direction: row-reverse;
            max-width: 1600px;
            height: calc(100vh - 24px);
            gap: 8px;
        }
        .map-col { flex: 1 1 auto; height: 100%; }
        .side-col {
            flex: 0 1 460px;
            min-width: 360px;
            height: 100%;
            overflow-y: auto;
            padding-right: 2px;
        }
    }

    .bar {
        width: 100%;
        max-width: 900px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 8px 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
    }
    .panel-actions { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
    .title { font-weight: 300; font-size: 1.05rem; letter-spacing: .5px; }
    .title b { font-weight: 600; }
    .map-badge {
        display: inline-block; margin-left: 6px; padding: 2px 9px;
        font-size: .72rem; font-weight: 600; letter-spacing: .5px;
        background: #1c4e5c; border: 1px solid #4f97a8; border-radius: 20px; color: var(--accent);
    }
    .field-ctl { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); flex-shrink: 0; }
    .field-ctl input {
        width: 66px; padding: 5px 8px; text-align: center;
        border: 1px solid #3f8090; border-radius: 8px;
        background: #123f4b; color: var(--text); font-size: .95rem; font-weight: 600;
        outline: none;
    }
    .field-ctl input:focus { border-color: var(--accent); background: #16505f; }
    .field-ctl select {
        padding: 5px 8px; border: 1px solid #3f8090; border-radius: 8px;
        background: #123f4b; color: var(--text); font-size: .9rem; font-weight: 600;
        outline: none; cursor: pointer;
    }
    .field-ctl select:focus { border-color: var(--accent); background: #16505f; }

    .phase-toggle { display: inline-flex; border: 1px solid #3f8090; border-radius: 8px; overflow: hidden; }
    .phase-toggle button {
        background: #123f4b; color: var(--muted); border: none; border-radius: 0;
        padding: 5px 12px; font-size: .82rem; font-weight: 600;
    }
    .phase-toggle button + button { border-left: 1px solid #3f8090; }
    .phase-toggle button.active { background: var(--accent); color: #08151a; }
    .phase-toggle button:hover:not(.active) { background: #16505f; color: var(--text); }

    button {
        background: #2f6474; color: #fff; border: 1px solid #4f97a8;
        padding: 6px 14px; border-radius: 9px; font-size: .82rem; font-weight: 500;
        cursor: pointer; transition: .12s;
    }
    button:hover { background: #3d8496; }
    button:active { transform: scale(.96); }
    button.danger { background: #7a3d3d; border-color: #b06a6a; }
    button.danger:hover { background: #984c4c; }

    .stage {
        width: 100%;
        max-width: 900px;
        aspect-ratio: 1 / 1;
        position: relative;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
    @media (min-width: 900px) {
        .stage { width: auto; height: 100%; max-width: 100%; max-height: 100%; }
    }

    .quick-routes {
        display: none;
        flex-direction: column;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
    }
    .quick-routes.show { display: flex; }
    .quick-routes h4 {
        font-size: .68rem; text-transform: uppercase; letter-spacing: .5px;
        color: var(--muted); font-weight: 600; margin-bottom: 2px;
    }
    .quick-routes button {
        text-align: left; white-space: normal; line-height: 1.25;
        font-size: .78rem; padding: 7px 9px;
    }

    .zoom-ctl {
        position: absolute; right: 10px; bottom: 10px;
        display: flex; flex-direction: column; gap: 6px; z-index: 5;
    }
    .zoom-ctl button {
        width: 38px; height: 38px; padding: 0; font-size: 1.15rem; line-height: 1;
        border-radius: 10px; background: rgba(16,51,61,0.85); border: 1px solid #4f97a8;
        backdrop-filter: blur(3px);
    }
    .zoom-ctl .zlvl {
        text-align: center; font-size: .62rem; color: var(--muted);
        background: rgba(12,39,49,0.8); border: 1px solid var(--line);
        border-radius: 8px; padding: 2px 0;
    }

    .results {
        width: 100%;
        max-width: 900px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px;
    }
    .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 12px;
    }
    .card .lbl { font-size: .62rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .card .val { font-size: 1.35rem; font-weight: 600; margin-top: 2px; font-feature-settings: "tnum"; }
    .card .val small { font-size: .7rem; font-weight: 300; color: var(--muted); }
    .card.me   { border-left: 3px solid var(--me); }
    .card.target { border-left: 3px solid var(--target); }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:middle; margin-right:4px; }
    .dot.me { background: var(--me); } .dot.target { background: var(--target); }

    .hint { font-size: .75rem; color: var(--muted); }
    .compass-note b { color: var(--target); }

    /* маршрут: точки + таблица участков */
    .results.path { display: block; }
    .path-points {
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
        padding: 8px 12px; margin-bottom: 8px; font-size: .95rem; font-weight: 600;
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    }
    .path-points .lbl { font-size: .62rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; margin-right: 4px; }
    .path-points .pt { color: var(--me); }
    .path-points .pt:last-child { color: var(--target); }
    .path-points .arrow { color: var(--muted); font-weight: 300; }
    .table-scroll { overflow-x: auto; }
    .seg-table {
        width: 100%; border-collapse: collapse; overflow: hidden;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    }
    .seg-table th, .seg-table td { padding: 7px 12px; text-align: left; font-size: .9rem; }
    .seg-table thead th {
        font-size: .62rem; text-transform: uppercase; letter-spacing: .6px;
        color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line);
    }
    .seg-table tbody tr + tr td { border-top: 1px solid rgba(45,103,117,0.4); }
    .seg-table td.seg { color: var(--accent); font-weight: 600; }
    .seg-table td small { color: var(--muted); font-weight: 300; }
    .seg-table tr.total td {
        border-top: 2px solid var(--line); font-weight: 700; color: var(--target);
        background: var(--panel-2);
    }
    .empty-note {
        grid-column: 1 / -1; color: var(--muted); font-size: .85rem;
        padding: 10px 4px;
    }

    /* модалка «Я здесь» */
    .modal-overlay {
        display: none; position: fixed; inset: 0; background: rgba(4,12,15,0.72);
        align-items: center; justify-content: center; z-index: 50; padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
        width: 100%; max-width: 420px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        padding: 16px; display: flex; flex-direction: column; gap: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    .modal h3 { font-size: 1rem; font-weight: 600; }
    .modal textarea {
        width: 100%; resize: vertical; min-height: 70px;
        background: #123f4b; color: var(--text); border: 1px solid #3f8090; border-radius: 8px;
        padding: 8px 10px; font: 13px/1.4 'Consolas', monospace; outline: none;
    }
    .modal textarea:focus { border-color: var(--accent); background: #16505f; }
    .modal-msg { font-size: .82rem; color: var(--muted); min-height: 1.2em; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>

<div class="app-shell">

    <div class="map-col">
        <div class="stage">
            <canvas id="map"></canvas>
            <div class="zoom-ctl">
                <button id="zoomIn" title="Приблизить">+</button>
                <div class="zlvl" id="zoomLvl">1.0×</div>
                <button id="zoomOut" title="Отдалить">−</button>
                <button id="zoomReset" title="Сбросить вид">⟲</button>
            </div>
        </div>
    </div>

    <div class="side-col">

        <div class="bar">
            <div class="title">🧭 <b>StarWarsRP</b> · навигатор<span class="map-badge" title="Автор">2562 · Glebak · Сержант</span></div>
        </div>

        <div class="bar">
            <div class="field-ctl">
                <label>Фаза</label>
                <div class="phase-toggle" id="phaseToggle">
                    <button type="button" data-phase="1">Phase-1</button>
                    <button type="button" data-phase="2">Phase-2</button>
                </div>
            </div>
            <div class="field-ctl">
                <label for="mapSelect">Карта</label>
                <select id="mapSelect"></select>
            </div>
        </div>

        <div class="bar">
            <div class="field-ctl">
                <label>Тип</label>
                <div class="phase-toggle" id="typeToggle">
                    <button type="button" data-cat="clone">Клон</button>
                    <button type="button" data-cat="transport">Транспорт</button>
                    <button type="button" data-cat="weapon">Оружие</button>
                </div>
            </div>
            <div class="field-ctl">
                <label for="modeSelect" id="modeLabel">Режим</label>
                <select id="modeSelect"></select>
            </div>
            <div class="field-ctl" id="speedCtl" style="display:none">
                <label for="speedSelect">Скорость</label>
                <select id="speedSelect"></select>
            </div>
            <div class="field-ctl" id="calibCtl" style="display:none">
                <label for="calibInput" id="calibLabel">Калибровка</label>
                <input type="number" id="calibInput" step="0.01" min="0" placeholder="—">
                <span>с/кл</span>
            </div>
        </div>

        <div class="bar" id="ballisticHeightCtl" style="display:none">
            <div class="field-ctl">
                <label for="meHeightInput">Высота «Я», м</label>
                <input type="number" id="meHeightInput" step="1" value="0">
            </div>
            <div class="field-ctl">
                <label for="targetHeightInput">Высота цели, м</label>
                <input type="number" id="targetHeightInput" step="1" value="0">
            </div>
        </div>

        <div class="bar">
            <div class="field-ctl">
                <label for="cellSize">Сторона клетки</label>
                <input type="number" id="cellSize" value="132" min="0.1" step="1">
                <span>ед.</span>
            </div>
            <div class="panel-actions">
                <button id="northBtn" title="Повернуть север на 90°">🧭 Север: →</button>
                <button id="hereBtn" title="Задать позицию по игровым координатам">📍 Я здесь</button>
                <button id="calibSaveBtn" style="display:none" title="Если точку пришлось перетащить на верное место — сохранить это как новый калибровочный замер">📌 Откалибровать по точке</button>
                <button id="calibResetBtn" style="display:none" title="Убрать все локальные калибровочные точки, добавленные в этом браузере">🗑 Сброс калибровки</button>
                <button id="mcb3dBtn" title="Показать/скрыть объёмные объекты на карте МЦБ">🧊 3D: вкл</button>
                <button id="undoBtn" title="Убрать последнюю точку">↶ Убрать последнюю</button>
                <button id="clearBtn" class="danger">✕ Сброс</button>
            </div>
        </div>
        <div class="hint" id="calibMsg" style="display:none"></div>

        <div class="quick-routes" id="quickRoutes"></div>

        <div class="results" id="results"></div>

        <div class="bar" style="justify-content:center; gap:10px;">
            <span class="hint" id="hintText"></span>
            <span class="hint compass-note" id="compassNote"></span>
        </div>

    </div>

</div>

<div class="modal-overlay" id="hereOverlay">
    <div class="modal">
        <h3>📍 Я здесь</h3>
        <p class="hint">Вставь строку из игры (setpos/setang) — позиция станет точкой №1 (или точкой «Я» в режиме «Оружие»).</p>
        <textarea id="hereInput" placeholder="setpos -650.866150 -6928.594238 -135.968750;setang 2.248406 -29.701571 0.000000"></textarea>
        <div class="modal-msg" id="hereMsg"></div>
        <div class="modal-actions">
            <button id="hereCancel" class="danger">Отмена</button>
            <button id="hereApply">Применить</button>
        </div>
    </div>
</div>

<script>
(function () {
    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    const cellSizeInput = document.getElementById('cellSize');
    const clearBtn = document.getElementById('clearBtn');
    const stage = document.querySelector('.stage');

    // ---- конфигурация карт ----
    // cols: столбцов (числа 1..cols); rows: строк (буквы A..)
    // rowsFromTop: true — строка A сверху; false — строка A снизу
    // ownLabels: true — рисовать свою сетку и подписи (легенда обрезана);
    //            false — подписи уже впечатаны в изображение
    // phase: номер фазы (1 или 2) — для группировки в переключателе фаз
    // worldCalib: калибровка «игровые координаты → карта» для кнопки «Я здесь».
    //   null, пока не откалибровано. Формат после калибровки:
    //   { points: [ { row:'A', col:1, corner:'br'|'tr'|'bl'|'tl'|undefined(=центр), wx: <setpos X>, wy: <setpos Y> }, ... ] }
    //   Нужно минимум 3 точки не на одной прямой (чем больше и чем сильнее разбросаны по
    //   карте — тем точнее). calibParams() считает полный аффинный пересчёт (независимые
    //   масштаб/сдвиг по X и Y) методом наименьших квадратов по всем точкам сразу — см. там же,
    //   почему это важно (простой поворот+единый масштаб на этой карте не работает).
    const MAPS = [
        { id: 'mcb',      name: 'МЦБ-17/9/3-18',       file: 'map3.jpg',           cols: 15, rows: 15, rowsFromTop: true,  ownLabels: true,  cellSide: 132, phase: 2,
          worldCalib: {
              // Калибровка под НОВУЮ картинку map3.png, 2026-09-06.
              // Дальние углы A1(br)/O15(br)/O1(bl)/A15(tr) убраны из фита совсем: даже
              // A1+O15 (наиболее согласованная пара) слегка тянули точность в районе базы
              // (макс. невязка 0.13-0.18 клетки среди 5 онлайн-точек). Без них, только на
              // 5 точных drag-точках у базы, невязка падает до 0.01-0.13 клетки. Точность
              // вдали от базы (там, где нет точек) при этом хуже, но пока вся активность
              // и все замеры — у базы, так что приоритет ей. Дальние углы оставлены
              // закомментированными ниже — вернуть, когда наберётся больше drag-точек по
              // всей карте (тогда веса снова выровняются).
              // { row: 'A', col: 1,  corner: 'br', wx: -15037.136719, wy: 15058.713867 },
              // { row: 'O', col: 15, corner: 'br', wx: 15832.211914,  wy: -15710.416992 },
              // { row: 'O', col: 1,  corner: 'bl', wx: -16127.879883, wy: -16219.968750 },
              // { row: 'A', col: 15, corner: 'tr', wx: 16122.243164,  wy: 16020.729492 },
              points: [
                  // Координаты x/y пересчитаны 2026-09-08 под обрезанную картинку (см. ниже:
                  // map3.jpg обрезан, убрана вшитая в оригинал служебная полоса-«шапка» с
                  // эмблемой/цифрами/буквами шириной 1/16 картинки сверху и слева). Формула
                  // пересчёта старой x/y (под неполную картинку) в новую: v' = (16*v - 1) / 15.
                  // онлайн-калибровка через drag+«Откалибровать по точке», сверено у базы, 2026-09-06:
                  { x: 0.02551,  y: 0.59040,  wx: -15461.859375, wy: -2940.364990 },
                  { x: 0.00836,  y: 0.58734,  wx: -15436.808594, wy: -2975.081055 },
                  { x: 0.02538,  y: 0.50425,  wx: -14819.037109, wy: -403.608185 },
                  { x: 0.04989,  y: 0.52431,  wx: -14054.929688, wy: -1023.626709 },
                  { x: 0.01771,  y: 0.39299,  wx: -15062.901367, wy: 3060.505371 },
                  { x: 0.02185,  y: 0.58975,  wx: -14991.987305, wy: -3053.016357 },
                  // была { x: 0.12125, y: 0.53440, wx: -13434.933594, wy: -418.923309 } —
                  // выброшена 2026-09-09: почти то же место переизмерено правильно (см. ниже,
                  // «комната хранения оружия»), разница оказалась 0.54 клетки по X — старая
                  // точка была ошибочной (собрана до того, как выяснилось, что для калибровки
                  // обязательно перетаскивать маркер перед «Откалибровать по точке»).
                  { x: 0.06902,  y: 0.53717,  wx: -15640.394531, wy: -416.015686 },
                  // точки вдали от базы (одно и то же место, повторный замер), 2026-09-08:
                  { x: 0.68764,  y: 0.59267,  wx: 11137.529297,  wy: -4225.649414 },
                  { x: 0.68878,  y: 0.59372,  wx: 11182.215820,  wy: -4260.047852 },
                  { x: 0.72468,  y: 0.64276,  wx: 12532.019531,  wy: -5832.390625 },
                  // северо-западная точка (была x:0.06023,y:0.06403 на необрезанной картинке)
                  // выброшена: она физически попадала на вшитую полосу-«шапку», а не на
                  // территорию — после обрезки картинки это невалидная позиция, нужен новый замер.
                  { x: 0.07621,  y: 0.03555,  wx: -12243.002930, wy: 13978.664062 },
                  { x: 0.47833,  y: 0.01292,  wx: 3680.416748,   wy: 13998.039062 },
                  { x: 0.48871,  y: 0.01235,  wx: 4091.648682,   wy: 13997.896484 },
                  { x: 0.45029,  y: 0.40092,  wx: 2027.900024,   wy: 2085.299561 },
                  { x: 0.64128,  y: 0.78521,  wx: 9036.029297,   wy: -10082.403320 },
                  // была { x: 0.09581, y: 0.5184, wx: -14483.073242, wy: 152.957870 } —
                  // выброшена 2026-09-09: повторный замер в 8.5 юнитах от этого места (ниже,
                  // «у базы, повторно») разошёлся с ней на 0.63/0.34 клетки, а leave-one-out
                  // против всех остальных точек показал у неё остаток 0.72/0.40 клетки — явный
                  // выброс (перетащена неточно), несмотря на то что не self-referential.
                  // посадочная площадка №3 (крайняя слева/отдельная в кластере из 5), центр,
                  // подтверждено перетаскиванием маркера, 2026-09-09:

    // рисует объём одного объекта: стены (стеклянный градиент + энергополосы), голо-крыша
    // (радиальная подсветка + диагональная сетка + светящийся контур) и подпись высоты.
    // taper < 1 сужает крышу к центру относительно основания — даёт силуэт башни/цистерны.
    // возвращает геометрию крыши, чтобы дорисовать доп. детали (антенна, кольца площадки...)
    function drawVolume(footprint, heightM, opts) {
        opts = opts || {};
        const W = canvas.width, H = canvas.height, s = scale;
        const EXTRUDE_SCALE = 0.5;   // визуальный демпфер, чтобы высокие объекты не перекрывали всю карту
        const LEAN = 0.32;           // изометрический наклон крыши (доля высоты) — даёт объём при виде строго сверху
        const LIGHT = { x: 0.5, y: -0.87 };  // условное «солнце» сверху-справа, туда же наклонена крыша
        const pxPerCellY = H / map.rows;
        const extrude = (heightM / cellSide) * pxPerCellY * EXTRUDE_SCALE;
        const base = footprint.map(p => ({ x: p.x * W, y: p.y * H }));
        const taper = opts.taper == null ? 1 : opts.taper;
        const bcx = base.reduce((sum, p) => sum + p.x, 0) / base.length;
        const bcy = base.reduce((sum, p) => sum + p.y, 0) / base.length;
        const leanX = extrude * LEAN;
        const top = base.map(p => ({ x: bcx + (p.x - bcx) * taper + leanX, y: p.y - extrude }));

        // мягкая контактная тень на земле (наклонена в сторону, противоположную «солнцу») —
        // без неё здание выглядит парящим, а не стоящим на земле
        if (!opts.fence) {
            ctx.save();
            ctx.beginPath();
            base.forEach((p, i) => {
                const sx = bcx + (p.x - bcx) * 1.1 - leanX * 0.25;
                const sy = bcy + (p.y - bcy) * 1.1 + extrude * 0.06;
                i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
            });
            ctx.closePath();
            ctx.filter = `blur(${(2.5 / s).toFixed(2)}px)`;
            ctx.fillStyle = 'rgba(0,8,12,0.38)';
            ctx.fill();
            ctx.filter = 'none';
            ctx.restore();
        }

        const wallAlpha = opts.fence ? 0.4 : 1;
        ctx.lineWidth = 1 / s;
        for (let i = 0; i < base.length; i++) {
            const j = (i + 1) % base.length;
            // освещённость грани — по направлению её внешней нормали относительно «солнца»;
            // ближняя к наклону крыши сторона светлее, дальняя темнее, как настоящий объём
            const mx = (base[i].x + base[j].x) / 2, my = (base[i].y + base[j].y) / 2;
            let nx = mx - bcx, ny = my - bcy;
            const nlen = Math.hypot(nx, ny) || 1;
            nx /= nlen; ny /= nlen;
            const lit = Math.max(0, nx * LIGHT.x + ny * LIGHT.y);
            const faceBright = 0.14 + 0.36 * lit;
            const topR = Math.round(70 + 140 * lit), topG = Math.round(120 + 120 * lit), topB = Math.round(150 + 100 * lit);

            const grad = ctx.createLinearGradient(base[i].x, base[i].y, top[i].x, top[i].y);
            grad.addColorStop(0, 'rgba(40,60,70,0.03)');
            grad.addColorStop(1, `rgba(${topR},${topG},${topB},${(faceBright * wallAlpha).toFixed(3)})`);
            ctx.beginPath();
            ctx.moveTo(base[i].x, base[i].y);
            ctx.lineTo(base[j].x, base[j].y);
            ctx.lineTo(top[j].x, top[j].y);
            ctx.lineTo(top[i].x, top[i].y);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = `rgba(${topR},${topG},${topB},${(0.3 * wallAlpha + 0.25 * lit * wallAlpha).toFixed(3)})`;
            ctx.stroke();
            // энергетические полосы на стене — ярче на освещённой грани
            const BANDS = opts.fence ? 5 : 3;
            for (let k = 1; k <= BANDS; k++) {
                const t = k / (BANDS + 1);
                const p1x = base[i].x + (top[i].x - base[i].x) * t, p1y = base[i].y + (top[i].y - base[i].y) * t;
                const p2x = base[j].x + (top[j].x - base[j].x) * t, p2y = base[j].y + (top[j].y - base[j].y) * t;
                ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y);
                ctx.lineWidth = 0.6 / s;
                ctx.strokeStyle = 'rgba(180,235,255,' + ((0.04 + (0.06 + 0.12 * lit) * Math.sin(t * Math.PI)) * wallAlpha).toFixed(3) + ')';
                ctx.stroke();
            }
        }

        const cx = top.reduce((sum, p) => sum + p.x, 0) / top.length;
        const cy = top.reduce((sum, p) => sum + p.y, 0) / top.length;
        const txs = top.map(p => p.x), tys = top.map(p => p.y);
        const minX = Math.min(...txs), maxX = Math.max(...txs);
        const minY = Math.min(...tys), maxY = Math.max(...tys);

        if (opts.fence) {
            // забор/силовое поле — только светящийся верхний контур, без сплошной крыши,
            // чтобы не перекрывать здания внутри периметра
            ctx.beginPath();
            top.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.closePath();
            ctx.shadowColor = 'rgba(111,225,255,0.6)';
            ctx.shadowBlur = 5 / s;
            ctx.lineWidth = 1 / s;
            ctx.strokeStyle = 'rgba(190,240,255,0.5)';
            ctx.stroke();
            ctx.shadowBlur = 0;
        } else {
            // крыша — радиальная голо-подсветка (ярче в центре — эффект купола) + сетка + контур
            ctx.beginPath();
            top.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.closePath();
            const roofRad = Math.max(maxX - minX, maxY - minY) * 0.75;
            const roofGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, roofRad);
            roofGrad.addColorStop(0, 'rgba(205,247,255,0.36)');
            roofGrad.addColorStop(1, 'rgba(143,222,255,0.10)');
            ctx.fillStyle = roofGrad;
            ctx.fill();

            ctx.save();
            ctx.clip();
            const span = maxY - minY;
            const spacing = Math.max(6 / s, (maxX - minX) / 6);
            ctx.strokeStyle = 'rgba(200,245,255,0.16)';
            ctx.lineWidth = 0.5 / s;
            for (let x = minX - span; x < maxX; x += spacing) {
                ctx.beginPath();
                ctx.moveTo(x, minY);
                ctx.lineTo(x + span, maxY);
                ctx.stroke();
            }
            ctx.restore();

            ctx.beginPath();
            top.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.closePath();
            ctx.shadowColor = 'rgba(111,225,255,0.9)';
            ctx.shadowBlur = 6 / s;
            ctx.lineWidth = 1.3 / s;
            ctx.strokeStyle = 'rgba(190,240,255,0.8)';
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        if (!opts.noLabel) {
            const lx = opts.labelPos ? opts.labelPos.x * W : cx;
            const ly = opts.labelPos ? opts.labelPos.y * H : cy;
            ctx.font = `bold ${(W / 85) / s}px system-ui`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.lineWidth = 3 / s;
            ctx.strokeStyle = 'rgba(5,15,20,0.75)';
            ctx.strokeText(heightM + ' м', lx, ly);
            ctx.fillStyle = '#eafcff';
            ctx.fillText(heightM + ' м', lx, ly);
        }

        return { cx, cy, minX, maxX, minY, maxY };
    }

    // диск-антенна на макушке башни + светящийся луч-маяк вверх
    function drawBeacon(v) {
        const s = scale, cx = v.cx, cy = v.cy;
        const r = (v.maxX - v.minX) * 0.6;
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, r * 1.6, r * 0.55, 0, 0, Math.PI * 2);
        const dishGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.6);
        dishGrad.addColorStop(0, 'rgba(210,248,255,0.55)');
        dishGrad.addColorStop(1, 'rgba(120,210,235,0.12)');
        ctx.fillStyle = dishGrad;
        ctx.fill();
        ctx.lineWidth = 1 / s;
        ctx.strokeStyle = 'rgba(200,245,255,0.7)';
        ctx.stroke();

        const beamH = r * 14;
        const beamGrad = ctx.createLinearGradient(cx, cy, cx, cy - beamH);
        beamGrad.addColorStop(0, 'rgba(150,230,255,0.5)');
        beamGrad.addColorStop(1, 'rgba(150,230,255,0)');
        ctx.fillStyle = beamGrad;
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.5, cy);
        ctx.lineTo(cx + r * 0.5, cy);
        ctx.lineTo(cx + r * 0.08, cy - beamH);
        ctx.lineTo(cx - r * 0.08, cy - beamH);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(230,252,255,0.95)';
        ctx.shadowColor = 'rgba(150,230,255,1)';
        ctx.shadowBlur = 8 / s;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
    }

    // две светящиеся жёлтые кольцевые посадочные площадки на крыше платформы
    function drawLandingRings(v) {
        const s = scale;
        const w = v.maxX - v.minX, h = v.maxY - v.minY;
        const ringR = Math.min(w, h) * 0.24;
        [0.33, 0.67].forEach(fx => {
            const rx = v.minX + w * fx, ry = v.minY + h * 0.55;
            [1, 0.6].forEach(rf => {
                ctx.beginPath();
                ctx.ellipse(rx, ry, ringR * rf, ringR * rf * 0.5, 0, 0, Math.PI * 2);
                ctx.lineWidth = 1.2 / s;
                ctx.strokeStyle = 'rgba(255,205,90,0.8)';
                ctx.shadowColor = 'rgba(255,190,60,0.8)';
                ctx.shadowBlur = 4 / s;
                ctx.stroke();
            });
        });
        ctx.shadowBlur = 0;
    }

    // объёмная (псевдо-3D) отрисовка объектов из MCB_OBJECTS — голографический стеклянный
    // стиль с доп. деталями по типу объекта (антенны-башни, кольца посадочной площадки)
    function drawMcbObjects() {
        if (map.id !== 'mcb' || !mcb3dOn) return;
        const bridges = {};
        MCB_OBJECTS.forEach(obj => {
            const v = drawVolume(obj.footprint, obj.height,
                { taper: obj.taper, noLabel: obj.noLabel, fence: obj.fence, labelPos: obj.labelPos });
            if (obj.beacon) drawBeacon(v);
            if (obj.rings) drawLandingRings(v);
            if (obj.bridge) (bridges[obj.bridge] = bridges[obj.bridge] || []).push(v);
        });
        // соединительная антенна-мостик между башнями одной группы (напр. башни связи)
        const s = scale;
        Object.values(bridges).forEach(group => {
            if (group.length < 2) return;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(group[0].cx, group[0].cy);
            ctx.lineTo(group[1].cx, group[1].cy);
            ctx.lineWidth = 1 / s;
            ctx.shadowColor = 'rgba(150,230,255,0.8)';
            ctx.shadowBlur = 4 / s;
            ctx.strokeStyle = 'rgba(200,245,255,0.55)';
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();
        });
    }

    // точка внутри полигона (луч по x), нужна для проверки LOS
    function pointInPoly(pt, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
            const hit = ((yi > pt.y) !== (yj > pt.y)) &&
                (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
            if (hit) inside = !inside;
        }
        return inside;
    }

    // проверка видимости между me и target (обе точки — норм-координаты) с учётом
    // высоты объектов MCB_OBJECTS; meH/targetH — высота глаза/цели над землёй, в метрах
    function checkLOS(me, target, meH, targetH) {
        if (map.id !== 'mcb') return null;
        const STEPS = 300;
        for (let i = 1; i < STEPS; i++) {
            const t = i / STEPS;
            const p = { x: me.x + (target.x - me.x) * t, y: me.y + (target.y - me.y) * t };
            const losHeight = meH + (targetH - meH) * t;
            for (const obj of MCB_OBJECTS) {
                if (pointInPoly(p, obj.footprint) && obj.height > losHeight) {
                    return { blocked: true, name: obj.name, height: obj.height, losHeight };
                }
            }
        }
        return { blocked: false };
    }

    const bg = new Image();
    let bgReady = false;
    bg.onload = () => {
        bgReady = true;
        stage.style.aspectRatio = bg.naturalWidth + ' / ' + bg.naturalHeight;
        resize();
    };

    let cellSide = 132;
    let points = [];     // массив {x,y} в норм-координатах поля [0..1]
    let currentCat = CATEGORIES.clone;   // текущий тип
    let currentMode = currentCat.modes[0];

    function loadMap(m) {
        map = m;
        cellSide = m.cellSide;
        cellSizeInput.value = m.cellSide;
        points = [];
        scale = 1; offX = 0; offY = 0;
        document.getElementById('zoomLvl').textContent = '1.0×';
        bgReady = false;
        bg.src = m.file;
        loadExtraCalib();
        lastHereWorld = null;
        updateQuickRoutesVisibility();
        updateMcb3dBtnVisibility();
        updateCalibSaveBtnVisibility();
        update();
    }

    // ---- онлайн-калибровка «Я здесь»: пользователь перетаскивает поставленную точку на
    // реально известное место и жмёт «Откалибровать по точке» — новый замер {x,y,wx,wy}
    // добавляется к расчёту аффинного фита и сохраняется в localStorage (переживает перезагрузку
    // страницы на этом устройстве/браузере). Не путать с «базовыми» точками worldCalib.points
    // в коде — те правятся вручную и одинаковы для всех; extraCalibPoints — локальные добавки.
    let extraCalibPoints = [];
    let lastHereWorld = null;   // {wx,wy} из последнего успешного «Я здесь» — нужно для калибровки
    function calibStorageKey(m) { return 'swrp_calib_extra_' + m.id; }
    function loadExtraCalib() {
        try { extraCalibPoints = JSON.parse(localStorage.getItem(calibStorageKey(map)) || '[]'); }
        catch (e) { extraCalibPoints = []; }
    }
    function saveExtraCalib() {
        localStorage.setItem(calibStorageKey(map), JSON.stringify(extraCalibPoints));
    }

    // направление севера: 0=вправо(→), 1=вниз(↓), 2=влево(←), 3=вверх(↑)
    let northDir = 0;
    const DIR_ARROW = ['→', '↓', '←', '↑'];
    const DIR_WORD  = ['вправо', 'вниз', 'влево', 'вверх'];

    // ---- вид (зум/панорама) в устройственных пикселях canvas ----
    let scale = 1, offX = 0, offY = 0;
    const MIN_SCALE = 1, MAX_SCALE = 12;

    function clampView() {
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
        const W = canvas.width, H = canvas.height;
        offX = Math.min(0, Math.max(W - W * scale, offX));
        offY = Math.min(0, Math.max(H - H * scale, offY));
    }
    function zoomAt(deviceX, deviceY, factor) {
        const old = scale;
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
        const k = scale / old;
        offX = deviceX - (deviceX - offX) * k;
        offY = deviceY - (deviceY - offY) * k;
        clampView();
        document.getElementById('zoomLvl').textContent = scale.toFixed(1) + '×';
        render();
    }

    // ---- размер canvas под дисплей ----
    function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        clampView();
        render();
    }

    // ---- координаты клетки из нормализованной точки ----
    function cellLabel(p) {
        let cx = Math.max(0, Math.min(map.cols - 1, Math.floor(p.x * map.cols)));
        let sy = Math.max(0, Math.min(map.rows - 1, Math.floor(p.y * map.rows))); // индекс строки сверху
        const rowIdx = map.rowsFromTop ? sy : (map.rows - 1 - sy);                // индекс буквы
        return LETTERS[rowIdx] + (cx + 1);   // напр. "H8": строка-буква + столбец-число
    }
    // ---- обратное преобразование: буква+число клетки (+ угол) → нормализованная точка ----
    // corner: 'center' (по умолчанию) | 'tl' | 'tr' | 'bl' | 'br' — угол клетки, а не только центр
    // (нужно для калибровки «Я здесь», когда известны координаты именно угла клетки)
    function cellPoint(row, col, corner) {
        const rowIdx = LETTERS.indexOf(row);
        const sy = map.rowsFromTop ? rowIdx : (map.rows - 1 - rowIdx);
        const left = (col - 1) / map.cols, right = col / map.cols;
        const top = sy / map.rows, bottom = (sy + 1) / map.rows;
        switch (corner) {
            case 'tl': return { x: left,  y: top };
            case 'tr': return { x: right, y: top };
            case 'bl': return { x: left,  y: bottom };
            case 'br': return { x: right, y: bottom };
            default:   return { x: (left + right) / 2, y: (top + bottom) / 2 };
        }
    }
    function cellCenter(row, col) { return cellPoint(row, col, 'center'); }

    // ---- «Я здесь»: перевод игровых координат (setpos/setang) в точку и стрелку на карте ----
    // Полный аффинный пересчёт (X = a*wx + b*wy + tx; Y = c*wx + d*wy + ty), коэффициенты — из
    // всех точек worldCalib.points методом наименьших квадратов. Проверено эмпирически на 6
    // замерах МЦБ (2026-07-06): простое «поворот + единый масштаб» по 2 точкам давало ошибку
    // 3-6 клеток на остальных точках (именно так был обнаружен баг «I1 определилась как I2»),
    // а независимые X/Y-масштаб+сдвиг — 0.1-0.26 клетки, то есть в пределах того, насколько
    // точно игрок может встать в угол клетки. Чем больше точек в points и чем шире они
    // разбросаны по карте (не на одной строке/столбце) — тем точнее фит.
    function calibParams() {
        const c = map.worldCalib;
        if (!c || !c.points) return null;
        const allPoints = c.points.concat(extraCalibPoints);
        if (allPoints.length < 3) return null;
        const pts = allPoints.map(p => {
            // точка либо привязана к углу клетки (row/col/corner), либо это «сырая» норм-точка
            // {x,y} — так сохраняются онлайн-калибровки, перетащенные пользователем на карте
            const cp = (p.x != null && p.y != null) ? { x: p.x, y: p.y } : cellPoint(p.row, p.col, p.corner || 'center');
            return { X: cp.x * map.cols * cellSide, Y: cp.y * map.rows * cellSide, wx: p.wx, wy: p.wy };
        });
        const n = pts.length;
        let Sxx = 0, Sxy = 0, Sx = 0, Syy = 0, Sy = 0;
        let SxX = 0, SyX = 0, SX = 0, SxY = 0, SyY = 0, SY = 0;
        for (const p of pts) {
            Sxx += p.wx * p.wx; Sxy += p.wx * p.wy; Sx += p.wx;
            Syy += p.wy * p.wy; Sy += p.wy;
            SxX += p.wx * p.X; SyX += p.wy * p.X; SX += p.X;
            SxY += p.wx * p.Y; SyY += p.wy * p.Y; SY += p.Y;
        }
        const A = [[Sxx, Sxy, Sx], [Sxy, Syy, Sy], [Sx, Sy, n]];
        const det3 = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
                        - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
                        + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
        const d = det3(A);
        if (d === 0) return null;
        const solve = b => {
            const sol = [];
            for (let col = 0; col < 3; col++) {
                const Ac = A.map(row => row.slice());
                for (let r = 0; r < 3; r++) Ac[r][col] = b[r];
                sol.push(det3(Ac) / d);
            }
            return sol;
        };
        const [a, b, tx] = solve([SxX, SyX, SX]);
        const [cc, dd, ty] = solve([SxY, SyY, SY]);
        return { a, b, cc, dd, tx, ty };
    }
    // игровые X/Y → нормализованная точка карты [0..1]; null, если калибровки нет
    function worldToNorm(wx, wy) {
        const p = calibParams();
        if (!p) return null;
        const X = p.a * wx + p.b * wy + p.tx;
        const Y = p.cc * wx + p.dd * wy + p.ty;
        return {
            x: Math.max(0, Math.min(1, X / (map.cols * cellSide))),
            y: Math.max(0, Math.min(1, Y / (map.rows * cellSide)))
        };
    }
    // yaw из setang (градусы) → угол взгляда в системе координат картинки (радианы, для стрелки).
    // Направление — стандартный вектор (cos(yaw), sin(yaw)) в игровых осях (обычная Source-engine
    // формула), затем применяется линейная часть аффинного преобразования (без сдвига tx/ty —
    // это направление, а не точка).
    // ВАЖНО: раньше здесь стоял «эмпирический» вариант (-cos(yaw), sin(yaw)) — он был подобран
    // под старую (ошибочную, similarity-фит) калибровку позиции и компенсировал именно её
    // ошибку поворота. После перехода на аффинный фит (см. calibParams) старая формула стала
    // давать азимут, отличающийся от реального на ~150-160° (проверено на замерах C13,
    // 2026-07-06: смотрю на N → yaw≈0, азимут 300 → yaw≈60, смотрю на S → yaw≈-163). Стандартная
    // формула на тех же замерах ошибается всего на 3-14° (остаток — точность самой калибровки
    // позиции + то, что «смотрю на S» замерено на глаз, а не по цифре в отличие от «азимут 300»).
    function worldYawToMapAngle(yawDeg) {
        const p = calibParams();
        if (!p) return null;
        const yawRad = yawDeg * Math.PI / 180;
        const wdirX = Math.cos(yawRad), wdirY = Math.sin(yawRad);
        const mdirX = p.a * wdirX + p.b * wdirY;
        const mdirY = p.cc * wdirX + p.dd * wdirY;
        return Math.atan2(mdirY, mdirX);
    }

    // ---- отрисовка ----
    function render() {
        const W = canvas.width, H = canvas.height;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, W, H);
        // применяем вид: смещение + масштаб
        ctx.setTransform(scale, 0, 0, scale, offX, offY);

        if (bgReady) ctx.drawImage(bg, 0, 0, W, H);
        else { ctx.fillStyle = '#123'; ctx.fillRect(0, 0, W, H); }

        drawMcbObjects();

        // сетка (толщина/шрифт компенсируют масштаб — постоянный экранный размер)
        const s = scale;
        if (map.ownLabels) {
            ctx.lineWidth = 1 / s;
            ctx.strokeStyle = 'rgba(140,200,215,0.18)';
            ctx.font = `${(H/70)/s}px system-ui`;
            ctx.fillStyle = 'rgba(200,235,245,0.7)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            for (let i = 0; i <= map.cols; i++) {
                const x = i / map.cols * W;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
            }
            for (let i = 0; i <= map.rows; i++) {
                const y = i / map.rows * H;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
            }
            // подписи столбцов/строк держим у видимого края canvas
            const edgeX = Math.max(0, -offX / s), edgeY = Math.max(0, -offY / s);
            for (let i = 0; i < map.cols; i++) {
                const cx = (i + 0.5) / map.cols * W;
                ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                ctx.fillText(i + 1, cx, edgeY + 3 / s);        // номера столбцов сверху
            }
            for (let i = 0; i < map.rows; i++) {
                const cy = (i + 0.5) / map.rows * H;
                const letter = LETTERS[map.rowsFromTop ? i : (map.rows - 1 - i)];
                ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
                ctx.fillText(letter, edgeX + 4 / s, cy);       // буквы строк слева
            }
        }

        // линия пути (по всем точкам подряд)
        if (points.length >= 2) {
            ctx.beginPath();
            ctx.moveTo(points[0].x * W, points[0].y * H);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x * W, points[i].y * H);
            ctx.strokeStyle = 'rgba(230,245,255,0.9)';
            ctx.lineWidth = 2 / s;
            ctx.setLineDash([8 / s, 6 / s]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // точки с подписями
        points.forEach((p, i) => {
            const st = pointStyle(i, points.length);
            drawPoint(p, st.color, st.label);
            if (p.dir != null) drawHeadingArrow(p, st.color);
        });

        drawCompass();
    }

    // стрелка направления взгляда («Я здесь» из setang), рисуется поверх точки
    function drawHeadingArrow(p, color) {
        const W = canvas.width, H = canvas.height, s = scale;
        const x = p.x * W, y = p.y * H;
        const len = Math.max(18, W / 20) / s;   // постоянная экранная длина
        const ex = x + Math.cos(p.dir) * len, ey = y + Math.sin(p.dir) * len;
        ctx.lineCap = 'round';
        ctx.lineWidth = 3 / s;
        ctx.strokeStyle = color;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
        const headLen = len * 0.35;
        const a1 = p.dir + Math.PI * 0.82, a2 = p.dir - Math.PI * 0.82;
        ctx.beginPath();
        ctx.moveTo(ex, ey); ctx.lineTo(ex + Math.cos(a1) * headLen, ey + Math.sin(a1) * headLen);
        ctx.moveTo(ex, ey); ctx.lineTo(ex + Math.cos(a2) * headLen, ey + Math.sin(a2) * headLen);
        ctx.stroke();
        ctx.lineCap = 'butt';
    }

    // цвет и подпись точки: старт — голубой, финиш — жёлтый, промежуточные — акцент
    function pointStyle(i, n) {
        if (currentCat.kind === 'ballistic') {
            return i === 0 ? { color: '#4fd0ff', label: 'Я' } : { color: '#ffd24a', label: 'Цель' };
        }
        if (i === 0)       return { color: '#4fd0ff', label: '1' };
        if (i === n - 1)   return { color: '#ffd24a', label: String(n) };
        return { color: '#6fc1d6', label: String(i + 1) };
    }

    // компас-HUD: стрелка на север, фиксирован в углу (без учёта зума/панорамы)
    function drawCompass() {
        const W = canvas.width;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const R = Math.max(24, W / 22);
        const cx = W - R - R * 0.6, cy = R + R * 0.6;
        const a = northDir * Math.PI / 2;          // угол севера (0=вправо, y вниз)
        const nx = Math.cos(a), ny = Math.sin(a);

        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(8,21,26,0.6)';
        ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(120,190,205,0.7)'; ctx.stroke();

        // стрелка N (красный конец) / хвост (серый)
        ctx.lineWidth = Math.max(2, R / 9);
        ctx.strokeStyle = '#ff6060';
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + nx * R * 0.7, cy + ny * R * 0.7); ctx.stroke();
        ctx.strokeStyle = 'rgba(200,225,235,0.6)';
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - nx * R * 0.5, cy - ny * R * 0.5); ctx.stroke();

        // буква N у острия
        ctx.fillStyle = '#ff8080';
        ctx.font = `bold ${R * 0.55}px system-ui`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('N', cx + nx * (R + R * 0.35), cy + ny * (R + R * 0.35));
    }

    function drawPoint(p, color, label) {
        if (!p) return;
        const W = canvas.width, H = canvas.height, s = scale;
        const x = p.x * W, y = p.y * H;
        const r = Math.max(6, W / 130) / s;   // постоянный экранный размер
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.shadowColor = color; ctx.shadowBlur = 12 / s;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = 2 / s; ctx.strokeStyle = '#08151a'; ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${(W/60)/s}px system-ui`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3 / s; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.strokeText(label, x, y - r - 3 / s);
        ctx.fillText(label, x, y - r - 3 / s);
    }

    // ---- вычисления ----
    // метрика участка между двумя норм-точками; клетки квадратные — корректно при любом cols/rows
    function segMetrics(a, b) {
        const vx = (b.x - a.x) * map.cols;   // экран вправо = +
        const vy = (b.y - a.y) * map.rows;   // экран вниз = +
        const distCells = Math.hypot(vx, vy);
        const distUnits = distCells * cellSide;
        let az = Math.atan2(vy, vx) * 180 / Math.PI - northDir * 90;  // 0° = север
        az = ((az % 360) + 360) % 360;
        return { distCells, distUnits, az };
    }
    // секунд на клетку для текущего режима (с учётом выбранной скорости)
    function currentSecPerCell() {
        if (currentCat.speeds) {
            const base = currentMode.secPerCell100;   // сек/клетку при скорости 100
            return base == null ? null : base * 100 / currentSpeed;
        }
        return currentMode.secPerCell;
    }
    function fmtTime(distCells) {
        const spc = currentSecPerCell();
        if (spc == null) return '—';
        return (distCells * spc).toFixed(1) + ' с';
    }

    const results = document.getElementById('results');

    function update() {
        if (currentCat.kind === 'ballistic') renderBallistic();
        else renderPath();
        render();
    }

    function card(cls, lbl, val) {
        return `<div class="card ${cls}"><div class="lbl">${lbl}</div><div class="val">${val}</div></div>`;
    }

    // оружие: я → цель, расстояние + азимут + поправка на высоту (перепад/угол/LOS)
    function renderBallistic() {
        results.className = 'results';
        const me = points[0], target = points[1];
        let dist = '— <small>ед.</small>', az = '— <small>°</small>';
        let dh = '—', elev = '— <small>°</small>', losCard = '';
        if (me && target) {
            const m = segMetrics(me, target);
            dist = m.distUnits.toFixed(1) + ' <small>ед. · ' + m.distCells.toFixed(2) + ' кл.</small>';
            az = m.az.toFixed(1) + ' <small>°</small>';

            const distMeters = cellsToMeters(m.distCells);
            const heightDiff = targetHeight - meHeight;
            dh = (heightDiff >= 0 ? '+' : '') + heightDiff.toFixed(0) + ' <small>м</small>';
            const elevDeg = distMeters > 0 ? Math.atan2(heightDiff, distMeters) * 180 / Math.PI : 0;
            elev = elevDeg.toFixed(1) + ' <small>°</small>';

            const los = checkLOS(me, target, meHeight, targetHeight);
            if (los) {
                losCard = los.blocked
                    ? card('los-bad', '🚫 Видимость', 'Перекрыта: ' + los.name + ' <small>(h=' + los.height + 'м)</small>')
                    : card('los-ok', '✅ Видимость', 'Прямая');
            }
        }
        results.innerHTML =
            card('me', '<span class="dot me"></span>Моя позиция', me ? cellLabel(me) : '—') +
            card('target', '<span class="dot target"></span>Цель', target ? cellLabel(target) : '—') +
            card('', '📏 Расстояние', dist) +
            card('', '🧭 Азимут', az) +
            card('', '↕️ Перепад высот', dh) +
            card('', '📐 Угол возвышения', elev) +
            losCard;
    }

    // клон/транспорт: маршрут, участки + итог
    function renderPath() {
        results.className = 'results path';
        if (points.length === 0) {
            results.innerHTML = '<div class="empty-note">Кликни по карте, чтобы поставить первую точку маршрута.</div>';
            return;
        }
        // строка точек
        const ptsHtml = points.map((p, i) =>
            (i ? '<span class="arrow">→</span>' : '') + '<span class="pt">' + cellLabel(p) + '</span>'
        ).join(' ');

        // участки
        let rows = '', totCells = 0, totUnits = 0;
        for (let i = 0; i + 1 < points.length; i++) {
            const m = segMetrics(points[i], points[i + 1]);
            totCells += m.distCells; totUnits += m.distUnits;
            rows += '<tr>' +
                '<td class="seg">' + (i + 1) + '→' + (i + 2) + '</td>' +
                '<td>' + m.distUnits.toFixed(1) + ' <small>ед. · ' + m.distCells.toFixed(2) + ' кл.</small></td>' +
                '<td>' + fmtTime(m.distCells) + '</td>' +
                '<td>' + m.az.toFixed(1) + '°</td>' +
                '</tr>';
        }
        let table = '';
        if (points.length >= 2) {
            table =
                '<div class="table-scroll"><table class="seg-table"><thead><tr>' +
                '<th>Участок</th><th>Расстояние</th><th>Время</th><th>Азимут</th>' +
                '</tr></thead><tbody>' + rows +
                '<tr class="total"><td>ИТОГО</td>' +
                '<td>' + totUnits.toFixed(1) + ' <small>ед. · ' + totCells.toFixed(2) + ' кл.</small></td>' +
                '<td>' + fmtTime(totCells) + '</td>' +
                '<td>—</td></tr>' +
                '</tbody></table></div>';
        } else {
            table = '<div class="empty-note">Добавь ещё точку, чтобы получить участок.</div>';
        }
        results.innerHTML =
            '<div class="path-points"><span class="lbl">Точки</span>' + ptsHtml + '</div>' + table;
    }

    // ---- ввод ----
    function eventToDevice(e) {
        const rect = canvas.getBoundingClientRect();
        const src = e.touches && e.touches.length ? e.touches[0] : e;
        return {
            x: (src.clientX - rect.left) * (canvas.width / rect.width),
            y: (src.clientY - rect.top) * (canvas.height / rect.height)
        };
    }
    function eventToNorm(e) {
        const d = eventToDevice(e);
        const baseX = (d.x - offX) / scale;
        const baseY = (d.y - offY) / scale;
        return {
            x: Math.max(0, Math.min(1, baseX / canvas.width)),
            y: Math.max(0, Math.min(1, baseY / canvas.height))
        };
    }

    let dragging = null; // индекс перетаскиваемой точки
    let panning = false, panLast = null;
    function hitTest(p) {
        const thr = 0.03 / scale;   // порог захвата точки в норм-координатах (учёт зума)
        // ищем ближайшую с конца, чтобы верхние точки перехватывались первыми
        for (let i = points.length - 1; i >= 0; i--) {
            if (Math.hypot(points[i].x - p.x, points[i].y - p.y) < thr) return i;
        }
        return null;
    }

    function onDown(e) {
        // панорама: ПКМ, средняя кнопка или Ctrl
        if (e.button === 2 || e.button === 1 || e.ctrlKey) {
            e.preventDefault();
            panning = true; panLast = eventToDevice(e);
            return;
        }
        e.preventDefault();
        const p = eventToNorm(e);
        const hit = hitTest(p);
        if (hit !== null) { dragging = hit; return; }
        if (currentCat.kind === 'ballistic') {
            if (points.length < 2) points.push(p);
            else points = [p];               // 3-й клик — новая позиция
        } else {
            points.push(p);                  // маршрут — добавить точку в конец
        }
        update();
    }
    function onMove(e) {
        if (panning) {
            const d = eventToDevice(e);
            offX += d.x - panLast.x; offY += d.y - panLast.y;
            panLast = d; clampView(); render();
            return;
        }
        if (dragging === null) return;
        e.preventDefault();
        points[dragging] = eventToNorm(e);
        update();
    }
    function onUp() { dragging = null; panning = false; }

    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // колесо — зум под курсором
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const d = eventToDevice(e);
        zoomAt(d.x, d.y, e.deltaY < 0 ? 1.15 : 1 / 1.15);
    }, { passive: false });

    // ---- сенсор: 1 палец — точка/перетаскивание, 2 пальца — зум+панорама ----
    let pinch = null;
    function touchDist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
    function touchMid(t) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: ((t[0].clientX + t[1].clientX) / 2 - rect.left) * (canvas.width / rect.width),
            y: ((t[0].clientY + t[1].clientY) / 2 - rect.top) * (canvas.height / rect.height)
        };
    }
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) { pinch = { d: touchDist(e.touches), m: touchMid(e.touches) }; return; }
        onDown(e);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinch) {
            e.preventDefault();
            const nd = touchDist(e.touches), nm = touchMid(e.touches);
            zoomAt(nm.x, nm.y, nd / pinch.d);
            offX += nm.x - pinch.m.x; offY += nm.y - pinch.m.y; clampView(); render();
            pinch = { d: nd, m: nm };
            return;
        }
        onMove(e);
    }, { passive: false });
    window.addEventListener('touchend', (e) => { if (e.touches.length === 0) pinch = null; onUp(); });

    // кнопки зума
    function centerDevice() { return { x: canvas.width / 2, y: canvas.height / 2 }; }
    document.getElementById('zoomIn').addEventListener('click', () => { const c = centerDevice(); zoomAt(c.x, c.y, 1.4); });
    document.getElementById('zoomOut').addEventListener('click', () => { const c = centerDevice(); zoomAt(c.x, c.y, 1 / 1.4); });
    document.getElementById('zoomReset').addEventListener('click', () => {
        scale = 1; offX = 0; offY = 0; clampView();
        document.getElementById('zoomLvl').textContent = '1.0×'; render();
    });

    cellSizeInput.addEventListener('input', () => {
        const v = parseFloat(cellSizeInput.value);
        if (!isNaN(v) && v > 0) { cellSide = v; update(); }
    });
    clearBtn.addEventListener('click', () => { points = []; update(); });
    document.getElementById('undoBtn').addEventListener('click', () => { points.pop(); update(); });

    // ---- переключатель объёмного (3D) слоя объектов на карте МЦБ ----
    let mcb3dOn = true;
    const mcb3dBtn = document.getElementById('mcb3dBtn');
    function updateMcb3dBtnVisibility() {
        mcb3dBtn.style.display = map.id === 'mcb' ? '' : 'none';
    }
    mcb3dBtn.addEventListener('click', () => {
        mcb3dOn = !mcb3dOn;
        mcb3dBtn.textContent = '🧊 3D: ' + (mcb3dOn ? 'вкл' : 'выкл');
        render();
    });

    // ---- «Я здесь»: модалка с вводом setpos/setang ----
    const hereBtn = document.getElementById('hereBtn');
    const hereOverlay = document.getElementById('hereOverlay');
    const hereInput = document.getElementById('hereInput');
    const hereMsg = document.getElementById('hereMsg');

    function openHereModal() {
        hereInput.value = '';
        hereMsg.textContent = '';
        hereOverlay.classList.add('show');
        hereInput.focus();
    }
    function closeHereModal() { hereOverlay.classList.remove('show'); }

    function applyHere() {
        const text = hereInput.value;
        const posM = text.match(/setpos\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/i);
        if (!posM) { hereMsg.textContent = 'Не удалось найти setpos в тексте.'; return; }
        const wx = parseFloat(posM[1]), wy = parseFloat(posM[2]);
        const angM = text.match(/setang\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/i);
        const yaw = angM ? parseFloat(angM[2]) : null;
        const yawNote = yaw != null ? ' · yaw (игра): ' + yaw.toFixed(1) + '°' : '';

        if (!map.worldCalib) {
            hereMsg.textContent = 'Для карты «' + map.name + '» ещё нет калибровки координат — распознано X ' +
                wx.toFixed(1) + ', Y ' + wy.toFixed(1) + yawNote + ', но точку поставить пока нельзя.';
            return;
        }
        const norm = worldToNorm(wx, wy);
        if (!norm) { hereMsg.textContent = 'Ошибка калибровки для этой карты.'; return; }
        let azNote = '';
        if (yaw != null) {
            const dirAngle = worldYawToMapAngle(yaw);
            if (dirAngle != null) {
                norm.dir = dirAngle;
                let az = dirAngle * 180 / Math.PI - northDir * 90;
                az = ((az % 360) + 360) % 360;
                azNote = ' · азимут на карте: ' + az.toFixed(1) + '°';
            }
        }
        if (points.length === 0) points.push(norm); else points[0] = norm;
        lastHereWorld = { wx, wy };
        updateCalibSaveBtnVisibility();
        update();
        hereMsg.textContent = 'Готово' + yawNote + azNote + '.';
        setTimeout(closeHereModal, 1400);
    }

    hereBtn.addEventListener('click', openHereModal);
    document.getElementById('hereCancel').addEventListener('click', closeHereModal);
    document.getElementById('hereApply').addEventListener('click', applyHere);
    hereOverlay.addEventListener('click', (e) => { if (e.target === hereOverlay) closeHereModal(); });

    // ---- кнопка «Откалибровать по точке»: точку №1 перетащили на реально верное место —
    // фиксируем пару (норм-координата на карте) ↔ (игровые wx,wy из последнего «Я здесь») ----
    const calibSaveBtn = document.getElementById('calibSaveBtn');
    const calibResetBtn = document.getElementById('calibResetBtn');
    const calibMsg = document.getElementById('calibMsg');
    function updateCalibSaveBtnVisibility() {
        calibSaveBtn.style.display = (map.worldCalib && lastHereWorld) ? '' : 'none';
        calibResetBtn.style.display = extraCalibPoints.length > 0 ? '' : 'none';
    }
    calibSaveBtn.addEventListener('click', () => {
        const p = points[0];
        if (!p || !lastHereWorld) return;
        const pt = { x: +p.x.toFixed(5), y: +p.y.toFixed(5), wx: lastHereWorld.wx, wy: lastHereWorld.wy };
        extraCalibPoints.push(pt);
        saveExtraCalib();
        updateCalibSaveBtnVisibility();
        update();
        calibMsg.style.display = '';
        calibMsg.innerHTML = 'Точка добавлена в калибровку этого браузера (' + extraCalibPoints.length +
            ' локальных). Чтобы закрепить её для всех — пришлите разработчику эту строку:<br>' +
            '<code style="user-select:all">{ x: ' + pt.x + ', y: ' + pt.y + ', wx: ' + pt.wx + ', wy: ' + pt.wy + ' }</code>';
    });
    calibResetBtn.addEventListener('click', () => {
        if (!confirm('Убрать все локальные калибровочные точки (' + extraCalibPoints.length + ') в этом браузере?')) return;
        extraCalibPoints = [];
        saveExtraCalib();
        updateCalibSaveBtnVisibility();
        update();
        calibMsg.style.display = '';
        calibMsg.textContent = 'Локальные калибровочные точки очищены.';
    });

    // ---- направление севера ----
    function updateCompassNote() {
        // по часовой от севера: N, E, S, W
        const dirs = ['N', 'E', 'S', 'W'];
        const words = [];
        for (let k = 0; k < 4; k++) {
            words.push(`<b>${dirs[k]}</b>=${k*90}° (${DIR_WORD[(northDir + k) % 4]})`);
        }
        document.getElementById('compassNote').innerHTML = words.join(', ');
        document.getElementById('northBtn').innerHTML = '🧭 Север: ' + DIR_ARROW[northDir];
    }
    document.getElementById('northBtn').addEventListener('click', () => {
        northDir = (northDir + 1) % 4;
        updateCompassNote();
        update();
    });

    // ---- выбор типа (клон/транспорт/оружие), режима и скорости ----
    const typeToggle = document.getElementById('typeToggle');
    const modeSelect = document.getElementById('modeSelect');
    const modeLabel = document.getElementById('modeLabel');
    const speedCtl = document.getElementById('speedCtl');
    const speedSelect = document.getElementById('speedSelect');
    const calibCtl = document.getElementById('calibCtl');
    const calibLabel = document.getElementById('calibLabel');
    const calibInput = document.getElementById('calibInput');
    const undoBtn = document.getElementById('undoBtn');
    const hintText = document.getElementById('hintText');
    let currentSpeed = 100;

    // ---- высота точек для миномёта (оружие): вводится вручную, в метрах ----
    const ballisticHeightCtl = document.getElementById('ballisticHeightCtl');
    const meHeightInput = document.getElementById('meHeightInput');
    const targetHeightInput = document.getElementById('targetHeightInput');
    let meHeight = 0, targetHeight = 0;
    meHeightInput.addEventListener('input', () => {
        meHeight = parseFloat(meHeightInput.value) || 0;
        update();
    });
    targetHeightInput.addEventListener('input', () => {
        targetHeight = parseFloat(targetHeightInput.value) || 0;
        update();
    });

    const HINTS = {
        path: 'ЛКМ — добавить точку маршрута · перетащить точку — сдвинуть · «↶ Убрать последнюю» / «Сброс» · колесо — зум · ПКМ/Ctrl — панорама',
        ballistic: 'ЛКМ — точка · перетащить точку — сдвинуть · 3-й клик — новая позиция · колесо — зум · ПКМ/Ctrl — панорама',
    };

    // ---- панель быстрых маршрутов для техники (только карта МЦБ) ----
    const quickRoutes = document.getElementById('quickRoutes');
    const quickRoutesTitle = document.createElement('h4');
    quickRoutes.appendChild(quickRoutesTitle);
    MCB_QUICK_ROUTES.forEach(r => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = r.row + '-' + r.col + ' — ' + r.name;
        btn.addEventListener('click', () => {
            points = [cellCenter(MCB_QUICK_START.row, MCB_QUICK_START.col), cellCenter(r.row, r.col)];
            update();
        });
        quickRoutes.appendChild(btn);
    });
    function updateQuickRoutesVisibility() {
        const show = map.id === 'mcb' && currentCat === CATEGORIES.transport;
        quickRoutes.classList.toggle('show', show);
        if (show) {
            quickRoutesTitle.textContent = currentMode.name + ' · старт ' + MCB_QUICK_START.row + MCB_QUICK_START.col;
        }
    }

    // калибровка сек/клетку для текущего режима — редактируется прямо на странице,
    // без правки кода (аналогично полю «Сторона клетки»)
    function updateCalibUI() {
        if (currentCat.kind !== 'path') { calibCtl.style.display = 'none'; return; }
        calibCtl.style.display = '';
        calibLabel.textContent = currentCat.speeds ? 'Калибровка (@100)' : 'Калибровка';
        const v = currentCat.speeds ? currentMode.secPerCell100 : currentMode.secPerCell;
        calibInput.value = v == null ? '' : v;
    }

    function setMode(i) {
        currentMode = currentCat.modes[i] || currentCat.modes[0];
        updateCalibUI();
        updateQuickRoutesVisibility();
        update();
    }

    function setCategory(catKey) {
        currentCat = CATEGORIES[catKey];
        Array.from(typeToggle.children).forEach(b => {
            b.classList.toggle('active', b.dataset.cat === catKey);
        });
        // заполнить режимы
        modeLabel.textContent = currentCat.modeLabel;
        modeSelect.innerHTML = '';
        currentCat.modes.forEach((m, i) => {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = m.name;
            modeSelect.appendChild(opt);
        });
        modeSelect.value = 0;
        currentMode = currentCat.modes[0];
        // выбор скорости — только если у категории есть speeds
        if (currentCat.speeds) {
            speedSelect.innerHTML = '';
            currentCat.speeds.forEach(sp => {
                const opt = document.createElement('option');
                opt.value = sp; opt.textContent = sp;
                speedSelect.appendChild(opt);
            });
            currentSpeed = currentCat.speeds[0];
            speedSelect.value = currentSpeed;
            speedCtl.style.display = '';
        } else {
            speedCtl.style.display = 'none';
        }
        // оружие — максимум 2 точки: обрежем лишние при переключении
        if (currentCat.kind === 'ballistic' && points.length > 2) points = points.slice(0, 2);
        undoBtn.style.display = currentCat.kind === 'path' ? '' : 'none';
        ballisticHeightCtl.style.display = currentCat.kind === 'ballistic' ? '' : 'none';
        hintText.textContent = HINTS[currentCat.kind];
        updateCalibUI();
        updateQuickRoutesVisibility();
        update();
    }

    modeSelect.addEventListener('change', () => setMode(+modeSelect.value));
    speedSelect.addEventListener('change', () => { currentSpeed = +speedSelect.value; update(); });
    typeToggle.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-cat]');
        if (btn) setCategory(btn.dataset.cat);
    });
    calibInput.addEventListener('input', () => {
        const v = calibInput.value.trim();
        const num = v === '' ? null : parseFloat(v);
        const val = (num == null || isNaN(num)) ? null : num;
        if (currentCat.speeds) currentMode.secPerCell100 = val;
        else currentMode.secPerCell = val;
        update();
    });

    // ---- выбор фазы и карты ----
    const mapSelect = document.getElementById('mapSelect');
    const phaseToggle = document.getElementById('phaseToggle');
    let currentPhase = 2;

    // заполнить список картами текущей фазы; вернуть глобальный индекс первой карты или null
    function populateMapSelect() {
        mapSelect.innerHTML = '';
        const inPhase = MAPS.map((m, i) => ({ m, i })).filter(x => x.m.phase === currentPhase);
        if (inPhase.length === 0) {
            const opt = document.createElement('option');
            opt.textContent = '— карт пока нет —';
            opt.disabled = true; opt.selected = true;
            mapSelect.appendChild(opt);
            mapSelect.disabled = true;
            return null;
        }
        mapSelect.disabled = false;
        inPhase.forEach(({ m, i }) => {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = m.name;
            mapSelect.appendChild(opt);
        });
        return inPhase[0].i;
    }

    function setPhase(p) {
        currentPhase = p;
        Array.from(phaseToggle.children).forEach(b => {
            b.classList.toggle('active', +b.dataset.phase === p);
        });
        const firstIdx = populateMapSelect();
        if (firstIdx !== null) {
            mapSelect.value = firstIdx;
            loadMap(MAPS[firstIdx]);
        }
    }

    mapSelect.addEventListener('change', () => loadMap(MAPS[+mapSelect.value]));
    phaseToggle.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-phase]');
        if (btn) setPhase(+btn.dataset.phase);
    });

    window.addEventListener('resize', resize);
    updateCompassNote();
    setCategory('clone');
    setPhase(2);
})();
</script>
</body>
</html>
